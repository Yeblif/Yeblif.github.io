name: Update repo list

# Builds repos.json from the GitHub API using the workflow token,
# so visitors' browsers never call the API (no 60/hour per-IP limit).
on:
  schedule:
    - cron: "23 5 * * *"   # daily, ~05:23 UTC
  workflow_dispatch:        # Actions tab → "Run workflow" to update the list now
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-repos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Pages repos
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          self="$(echo "${OWNER}.github.io" | tr '[:upper:]' '[:lower:]')"
          gh api --paginate "users/${OWNER}/repos?per_page=100&type=owner" \
            | jq -s --arg self "$self" --arg owner "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" '
                add
                | map(select(.has_pages and (.fork | not) and (.private | not) and ((.name | ascii_downcase) != $self)))
                | map({
                    name,
                    desc: (.description // ""),
                    topics: (.topics // []),
                    repo: .html_url,
                    site: (if ((.homepage // "") | test("github\\.io"; "i")) then .homepage
                           else "https://\($owner).github.io/\(.name)/" end),
                    pushed: .pushed_at
                  })
                | sort_by(.name | ascii_downcase)' > repos.json.new
          # Only accept a non-empty, valid result
          jq -e 'type == "array"' repos.json.new > /dev/null
          mv repos.json.new repos.json

      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code -- repos.json 2>/dev/null && git ls-files --error-unmatch repos.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git commit -m "chore(data): update repos.json"
          git push
