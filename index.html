<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeblif — Tools &amp; Pages</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5b6475;
    --border: #e1e4ea; --accent: #2457d6; --chip: #eef1f6; --chip-on: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2;
      --border: #2a313c; --accent: #7aa2ff; --chip: #232a35; --chip-on: #4a78f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  input[type=search] {
    flex: 1 1 220px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit;
  }
  .chip {
    border: 1px solid var(--border); background: var(--chip); color: var(--text);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .card h2 { margin: 0; font-size: 16px; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .desc { color: var(--muted); margin: 0; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; background: var(--chip); padding: 2px 8px; border-radius: 999px; color: var(--muted); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .meta a { color: var(--muted); }
  .status { color: var(--muted); padding: 20px 0; }
  footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Yeblif</h1>
  <p class="sub">Every GitHub Pages site across my repos, listed automatically.</p>

  <div class="controls">
    <input type="search" id="q" placeholder="Search…" aria-label="Search">
    <div id="chips"></div>
  </div>

  <div id="status" class="status">Loading…</div>
  <div id="grid" class="grid"></div>

  <footer>
    Built from the GitHub API. Any public repo with Pages switched on appears here.
    · <a href="https://github.com/Yeblif">github.com/Yeblif</a>
  </footer>
</main>

<script>
const USER = "Yeblif";
const SELF = (USER + ".github.io").toLowerCase();
const CACHE_KEY = "pages-index-v1";
const CACHE_MS = 60 * 60 * 1000; // 1 hour — keeps well inside the API's 60 requests/hour limit
const TOPIC_ORDER = ["work", "c3d", "homelab", "fusion"];

let repos = [];
let activeTopic = "all";

function cacheGet() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Date.now() - c.t < CACHE_MS) return c.data;
  } catch (e) {}
  return null;
}
function cacheSet(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
}

async function load() {
  const cached = cacheGet();
  if (cached) return cached;
  let all = [], page = 1;
  while (true) {
    const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&sort=pushed`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(res.status === 403 ? "GitHub API rate limit hit. Try again in a bit." : `GitHub API error ${res.status}`);
    const batch = await res.json();
    all = all.concat(batch);
    if (batch.length < 100) break;
    page++;
  }
  const data = all
    .filter(r => r.has_pages && !r.fork && r.name.toLowerCase() !== SELF)
    .map(r => ({
      name: r.name,
      desc: r.description || "",
      topics: r.topics || [],
      repo: r.html_url,
      site: r.homepage && /github\.io/i.test(r.homepage) ? r.homepage : `https://${USER.toLowerCase()}.github.io/${r.name}/`,
      pushed: r.pushed_at
    }));
  cacheSet(data);
  return data;
}

function prettyName(n) {
  return n.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase()).replace(/\bC3d\b/, "C3D").replace(/\bDmrb\b/, "DMRB");
}

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

function renderChips() {
  const present = new Set(repos.flatMap(r => r.topics));
  const topics = ["all", ...TOPIC_ORDER.filter(t => present.has(t)),
    ...[...present].filter(t => !TOPIC_ORDER.includes(t)).sort()];
  const box = document.getElementById("chips");
  box.style.display = "flex"; box.style.flexWrap = "wrap"; box.style.gap = "6px";
  box.replaceChildren(...topics.map(t => {
    const b = el("button", { class: "chip" + (t === activeTopic ? " on" : ""), type: "button" }, t);
    b.onclick = () => { activeTopic = t; renderChips(); render(); };
    return b;
  }));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = repos.filter(r =>
    (activeTopic === "all" || r.topics.includes(activeTopic)) &&
    (!q || (r.name + " " + r.desc + " " + r.topics.join(" ")).toLowerCase().includes(q)));

  const status = document.getElementById("status");
  status.textContent = list.length ? "" : (repos.length ? "Nothing matches." : "No Pages sites found yet.");
  status.style.display = list.length ? "none" : "block";

  document.getElementById("grid").replaceChildren(...list.map(r => {
    const card = el("div", { class: "card" });
    const h = el("h2");
    h.append(el("a", { href: r.site }, prettyName(r.name)));
    card.append(h);
    if (r.desc) card.append(el("p", { class: "desc" }, r.desc));
    else card.append(el("p", { class: "desc" }, ""));
    if (r.topics.length) {
      const tags = el("div", { class: "tags" });
      r.topics.forEach(t => tags.append(el("span", { class: "tag" }, t)));
      card.append(tags);
    }
    const meta = el("div", { class: "meta" });
    meta.append(el("span", {}, "Updated " + new Date(r.pushed).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })));
    meta.append(el("a", { href: r.repo }, "repo ↗"));
    card.append(meta);
    return card;
  }));
}

document.getElementById("q").addEventListener("input", render);

load().then(data => {
  repos = data.sort((a, b) => a.name.localeCompare(b.name));
  renderChips();
  render();
}).catch(err => {
  document.getElementById("status").textContent = err.message;
});
</script>
</body>
</html>
